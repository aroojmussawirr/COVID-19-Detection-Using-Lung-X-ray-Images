<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prediction Result</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 500px;
      width: 100%;
    }
    h1 {
      color: #333;
    }
    .result {
      font-size: 20px;
      margin: 20px 0;
      font-weight: bold;
    }
    .positive {
      color: #e63946;
    }
    .negative {
      color: #2a9d8f;
    }
    .model-info {
      margin-top: 10px;
      font-size: 14px;
      color: #555;
      font-style: italic;
    }
    img {
      max-width: 100%;
      max-height: 300px;
      margin-top: 15px;
      border-radius: 8px;
      border: 2px solid #ddd;
      object-fit: contain;
    }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 15px;
      background: #4CAF50;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }
    a:hover {
      background: #45a049;
    }
    .disclaimer {
      margin-top: 15px;
      font-size: 12px;
      color: #777;
      font-style: italic;
    }
    footer {
      margin-top: 20px;
      font-size: 12px;
      color: #555;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Prediction Result</h1>
    <p class="result {{ 'positive' if 'Positive' in result else 'negative' }}">
      {{ result }} <br>
      (Confidence: {{ confidence }})
    </p>

    <!-- Added model info -->
    <p class="model-info">Prediction generated using <b>DenseNet121</b> model</p>

    <img src="{{ url_for('uploaded_file', filename=image_filename) }}" alt="Uploaded X-ray">
    <br>
    <a href="{{ url_for('index') }}">Try Another Scan</a>

    <!-- Added disclaimer -->
    <p class="disclaimer">
      ⚠ This system is for study and research purposes only. For final medical diagnosis, please consult a qualified doctor.
    </p>
  

  <!-- Footer -->
  <footer>
    <p>Developed for Final Year Project</p>
  </footer>
  </div>
</body>
</html>
